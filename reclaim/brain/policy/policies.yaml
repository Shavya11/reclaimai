# Policy table. Rules are DATA, not code — V2 swaps this file for a DB table
# without touching diagnosis, policy or guardrail logic.
#
# Keyed by leak_type, then root_cause. Every row states a rationale, because the
# audit trail quotes it back and "why did it do that?" must have an answer that
# was written before the run, not after.
#
# Five rows are no_auto_action. That is deliberate and it is the differentiator:
# knowing when the right move is to stop and fetch a human is what separates this
# from something that always acts.

FAILED_PAYMENT:

  BANK_DOWNTIME:
    strategy: silent_retry
    schedule: ["20m", "2h", "24h"]
    max_attempts: 3
    notify_customer: false
    rationale: >-
      Transient issuer outage. The customer did nothing wrong and can do nothing
      about it; contacting them creates needless alarm and support load.

  INSUFFICIENT_FUNDS:
    strategy: scheduled_retry
    schedule: ["next_salary_window", "+7d"]
    max_attempts: 2
    notify_customer: true
    channel: WHATSAPP
    tone: gentle
    rationale: >-
      A timing problem, not intent. Retrying at the moment balance is likeliest
      to have been restored is worth more than retrying sooner.

  EXPIRED_INSTRUMENT:
    strategy: request_new_method
    schedule: ["immediate", "+48h"]
    max_attempts: 2
    notify_customer: true
    channel: EMAIL
    tone: neutral
    prefill_method: upi
    rationale: >-
      No retry can succeed against a dead card. Customer action is required, and
      the link must not send them back to the instrument that just failed.

  INVALID_INSTRUMENT:
    strategy: request_new_method
    schedule: ["immediate", "+48h"]
    max_attempts: 2
    notify_customer: true
    channel: EMAIL
    tone: neutral
    prefill_method: upi
    rationale: >-
      The card details cannot be corrected by us. Ask once, offer an easier
      method, and stop.

  AUTH_DROPOFF:
    strategy: friction_reduction
    schedule: ["15m", "+24h"]
    max_attempts: 2
    notify_customer: true
    channel: SMS
    tone: gentle
    prefill_method: upi
    rationale: >-
      The customer intended to pay and abandoned at 3DS/OTP. UPI removes the
      step they gave up on, so reduce friction rather than repeat it.

  LIMIT_EXCEEDED:
    strategy: scheduled_retry
    schedule: ["+1d@10:00"]
    max_attempts: 1
    notify_customer: false
    rationale: >-
      A daily or per-transaction cap resets on its own. Retry once after the
      reset; telling the customer adds nothing they can act on.

  TECHNICAL_ERROR:
    strategy: silent_retry
    schedule: ["10m", "1h"]
    max_attempts: 2
    notify_customer: false
    rationale: >-
      Our side or the integration. Never make a customer answer for our bug.

  CART_ABANDONMENT:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      A cart abandonment recorded against a payment attempt is a detector bug.
      Escalate rather than guess.

  RISK_DECLINE:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      The issuer flagged risk. Repeated retries against a risk decline look like
      card testing and can cost the merchant its account.

  MANDATE_REVOKED:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      The customer cancelled the mandate. Retrying is charging someone who has
      explicitly withdrawn permission.

  POLICY_BLOCK:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      Blocked by merchant or network policy. No amount of retrying changes a
      configuration decision.

  UNKNOWN:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      Insufficient confidence to act on someone's money. An honest UNKNOWN that
      reaches a human beats a confident guess that reaches their bank account.

ABANDONED_CART:

  CART_ABANDONMENT:
    strategy: friction_reduction
    schedule: ["2h", "+24h"]
    max_attempts: 2
    notify_customer: true
    channel: WHATSAPP
    tone: gentle
    prefill_method: upi
    rationale: >-
      Intent was shown and never completed. One nudge with a frictionless link,
      one follow-up, then stop.

  UNKNOWN:
    strategy: no_auto_action
    escalate_to: human
    rationale: "Insufficient confidence to act."

FAILED_MANDATE:

  MANDATE_REVOKED:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      Permission was withdrawn. This is a sales conversation, not a retry.

  BANK_DOWNTIME:
    strategy: silent_retry
    schedule: ["2h", "24h"]
    max_attempts: 2
    notify_customer: false
    rationale: "Mandate debits fail on outages like anything else."

  INSUFFICIENT_FUNDS:
    strategy: scheduled_retry
    schedule: ["next_salary_window"]
    max_attempts: 2
    notify_customer: true
    channel: SMS
    tone: gentle
    rationale: >-
      Recurring debits fail hardest just before payday. Retry after it.

  UNKNOWN:
    strategy: no_auto_action
    escalate_to: human
    rationale: "Insufficient confidence to act."

# ---------------------------------------------------------------------------
# V2 — B2B receivables.
#
# The engine below this file did not change. What changed is that an invoice is
# not a failed payment: nothing declined, so there is no error code to read, and
# the reason it is unpaid is organisational rather than technical. That makes
# the ladder — not the retry — the instrument, and it makes going QUIET on a
# promise as important an action as sending anything.
#
# `ladder:` is the one new field. A dunning sequence escalates in tone and in
# recipient as it climbs, and expressing that as four rows of data beats
# expressing it as a branch in the engine. Step N applies to attempt N.
# ---------------------------------------------------------------------------

OVERDUE_INVOICE:

  INVOICE_NOT_RECEIVED:
    strategy: request_new_method
    schedule: ["immediate", "+3d"]
    max_attempts: 2
    notify_customer: true
    channel: EMAIL
    tone: neutral
    rationale: >-
      Nothing is in dispute and nobody is refusing; the document never landed.
      Resend it with a payment link and stop. Chasing harder an invoice the
      buyer has not seen is how a supplier relationship gets spent on nothing.

  AWAITING_APPROVAL:
    strategy: scheduled_retry
    schedule: ["+7d", "+14d"]
    max_attempts: 2
    notify_customer: true
    channel: EMAIL
    tone: gentle
    rationale: >-
      The invoice is inside the buyer's AP process and a person there has
      already said so. Their approval cycle is not a delinquency, and a weekly
      touch is the most that is useful — anything faster annoys the one person
      who is actually helping.

  BUYER_CASH_CRUNCH:
    strategy: dunning_ladder
    schedule: ["+7d", "+21d"]
    max_attempts: 2
    notify_customer: true
    channel: EMAIL
    ladder:
      - {tone: gentle, action: SEND_LINK}
      - {tone: firm, action: ESCALATE}
    rationale: >-
      The buyer intends to pay and cannot yet. Two touches spaced wide, then a
      human who can actually discuss instalments — which is a commercial
      decision and therefore never the agent's to make.

  PAYMENT_STALLED:
    strategy: dunning_ladder
    schedule: ["immediate", "+7d", "+15d", "+30d"]
    max_attempts: 4
    notify_customer: true
    channel: EMAIL
    ladder:
      - {tone: polite, action: NOTIFY}
      - {tone: firm, action: SEND_LINK}
      - {tone: firm, action: SEND_LINK, cc: finance_manager}
      - {tone: final, action: ESCALATE}
    rationale: >-
      No dispute, no promise, no reply — it has simply stopped moving. This is
      the ladder proper: polite, firmer with a link, firmer again with the
      finance manager copied, and then a human account manager while the agent
      stops. A broken promise lands here, one rung further up than it left.

  INVOICE_DISPUTED:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      A dispute is a conversation about what is owed, not a collection. Dunning
      someone who has told you the amount is wrong destroys the account and
      recovers nothing. It is not unrecoverable — a person resolves it and it
      gets paid — which is why it is escalated rather than written off.

  UNKNOWN:
    strategy: no_auto_action
    escalate_to: human
    rationale: >-
      Insufficient confidence to chase a business for money. The same rule as
      everywhere else in this table.
