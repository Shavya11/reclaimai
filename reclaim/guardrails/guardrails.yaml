# Guardrail thresholds. Data, not code — a merchant tunes these in V2 through an
# admin API without a deploy. Every number here is a policy decision someone
# should be able to argue with, which is exactly why none of them are literals
# buried in a function.

kill_switch:
  # Mirrors AUTOPILOT_ENABLED in the environment. Env wins.
  enabled: true

quiet_hours:
  start: "20:00"
  end: "09:00"
  # Silent retries reach the bank, not the person, so they are exempt.
  applies_to_contact_only: true

max_attempts:
  global_hard_cap: 3

cooldown:
  hours_between_contacts: 24

frequency_cap:
  # Per CUSTOMER, across every record they own. A customer with four failed
  # payments gets two messages, not four.
  max_contacts: 2
  window_days: 7

value_ceiling:
  # Paise. Above this an action needs a human, whatever the policy says.
  requires_human_above: 5000000   # ₹50,000

  # Per leak type, because the ceiling is a judgement about a KIND of money.
  # ₹50,000 is a lot of authority for an agent chasing a failed consumer card
  # and seven records in a hundred exceed it. The same number against B2B
  # receivables, where a routine invoice is ₹2 lakh, sends four invoices in five
  # to a human and turns the agent off. A leak type with no entry here inherits
  # the strict number above — a missing row must never widen authority.
  by_leak_type:
    OVERDUE_INVOICE: 60000000     # ₹6,00,000

daily_budget:
  max_auto_actions_per_day: 200

confidence_floor:
  # Ties the model's honesty to the system's behaviour: a diagnosis that admits
  # low confidence cannot move money.
  minimum: 0.6

freshness:
  # Older than this and chasing it is harassment, not collection.
  max_age_days: 90

promise_window:
  # V2. Somebody said they would pay on a date; contact is held until it passes.
  # The grace period is the difference between firm and unpleasant — a promise
  # made for Friday is not dunned at one minute past midnight on Saturday.
  grace_hours: 24
  # A promise further out than this is a brush-off, not a commitment, and
  # honouring it would park a receivable for a quarter. Beyond it the extracted
  # date is refused and the reply reaches a human instead.
  max_horizon_days: 45
