# Render blueprint — the API, the webhook receiver, and nothing else.
#
# Point Render at this repo and it reads this file. Native Python runtime, no
# container: Render installs requirements.txt and runs uvicorn directly, which
# is one less build step to go wrong on a deadline.
#
# The dashboard lives on Vercel (see ui/vercel.json). This service still serves
# a copy of it at / from the committed ui/out, which is a useful fallback but
# not the URL to demo from.
#
# THE REASON THIS DEPLOYMENT EXISTS is the webhook. Everything else about it is
# incidental: a public URL is the only thing standing between this project and
# a genuine Razorpay delivery, which is the last untested seam in the system.

services:
  - type: web
    name: reclaimai-api
    runtime: python
    plan: free
    region: singapore # closest to Razorpay; keeps webhook round-trips short
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn reclaim.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    # A free instance has an ephemeral disk: the database is wiped on every
    # restart and SEED_ON_BOOT rebuilds a batch. To keep data across restarts,
    # move to a paid plan and uncomment this. Nothing else changes.
    # disk:
    #   name: reclaim-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # A cold instance starts with an empty disk, and an empty disk serves an
      # empty dashboard. Guarded on the table being empty rather than on this
      # flag alone, so a restart cannot wipe a batch someone is demonstrating.
      - key: SEED_ON_BOOT
        value: "true"

      # The rupee sign is in almost every line this program logs, and a process
      # without this dies formatting money on a non-UTF-8 default.
      - key: PYTHONIOENCODING
        value: utf-8

      # Set this to your Vercel URL once the frontend is deployed, with no
      # trailing slash — e.g. https://reclaimai.vercel.app. Without it the
      # browser refuses every /api/* call from the dashboard and the page sits
      # on a red banner. Vercel *preview* URLs are matched by a regex in
      # api/app.py and do not need listing here.
      - key: CORS_ORIGINS
        sync: false

      # Keep DRY_RUN true unless you are specifically doing the live webhook
      # proof. Test mode moves no real money, but a public URL that can mint
      # payment links is still worth being deliberate about.
      - key: DRY_RUN
        value: "true"

      - key: AUTOPILOT_ENABLED
        value: "true"

      - key: DATABASE_URL
        value: sqlite:////tmp/reclaim.db

      - key: TIMEZONE
        value: Asia/Kolkata

      # sync: false means "prompt me, do not store it in git". Set these in the
      # Render dashboard. RAZORPAY_WEBHOOK_SECRET must match the string you type
      # into the Razorpay webhook form character for character — a mismatch
      # means every delivery fails verification and is discarded, which is the
      # correct behaviour and an infuriating way to spend an afternoon.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
